name: Update unified source
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['update.py', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check original authors' stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python update.py
      - name: Publish source if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fnpack.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update upstream stable releases'
            git push origin HEAD:main
          fi
